version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: task-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-task_platform}
      MYSQL_USER: ${DB_USERNAME:-task_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./server
    container_name: task-backend
    restart: always
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    depends_on:
      - mysql
    env_file:
      - .env.prod
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_TYPE=mysql
    volumes:
      - uploads_data:/app/uploads

  admin:
    build: ./admin
    container_name: task-admin
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
